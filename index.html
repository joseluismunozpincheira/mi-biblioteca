<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Biblioteca</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
}

.filtros {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
}

input {
    padding: 8px;
    font-size: 14px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
    text-align: left;
    font-size: 14px;
}

th {
    background: #222;
    color: white;
}

tr:hover {
    background: #f1f1f1;
}

.portada {
    width: 60px;
}
</style>
</head>

<body>

<h1>📚 Mi Biblioteca</h1>

<div class="filtros">
    <input type="text" id="fTitulo" placeholder="Filtrar por título">
    <input type="text" id="fAutor" placeholder="Filtrar por autor">
    <input type="text" id="fCategoria" placeholder="Filtrar por categoría">
    <input type="text" id="fColeccion" placeholder="Filtrar por colección">
    <input type="text" id="fVol" placeholder="Filtrar por Vol">
</div>

<table>
    <thead>
        <tr>
            <th>Portada</th>
            <th>Título</th>
            <th>Autor</th>
            <th>Categoría</th>
            <th>Colección</th>
            <th>Vol</th>
        </tr>
    </thead>
    <tbody id="tablaLibros"></tbody>
</table>

<script>
let libros = [];

fetch("data/libros.json")
    .then(res => res.json())
    .then(data => {
        libros = data;
        mostrarLibros(libros);
    });

function mostrarLibros(lista) {
    const tabla = document.getElementById("tablaLibros");
    tabla.innerHTML = "";

    lista.forEach(l => {
        const fila = document.createElement("tr");

        fila.innerHTML = `
            <td>${l.Imagen ? `<img src="${l.Imagen}" class="portada">` : ""}</td>
            <td>${l.Titulo || ""}</td>
            <td>${l.Autor || ""}</td>
            <td>${l.Categoria || ""}</td>
            <td>${l.Coleccion || ""}</td>
            <td>${l.Vol || ""}</td>
        `;

        tabla.appendChild(fila);
    });
}

document.querySelectorAll("input").forEach(input => {
    input.addEventListener("input", filtrar);
});

function filtrar() {
    const t = document.getElementById("fTitulo").value.toLowerCase();
    const a = document.getElementById("fAutor").value.toLowerCase();
    const c = document.getElementById("fCategoria").value.toLowerCase();
    const col = document.getElementById("fColeccion").value.toLowerCase();
    const v = document.getElementById("fVol").value.toLowerCase();

    const filtrados = libros.filter(l =>
        (l.Titulo || "").toLowerCase().includes(t) &&
        (l.Autor || "").toLowerCase().includes(a) &&
        (l.Categoria || "").toLowerCase().includes(c) &&
        (l.Coleccion || "").toLowerCase().includes(col) &&
        (String(l.Vol || "")).toLowerCase().includes(v)
    );

    mostrarLibros(filtrados);
}
</script>

</body>
</html>
